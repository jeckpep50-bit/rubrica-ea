<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autorreflexión · Eight Academy</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#D2EFF8">
<link rel="icon" type="image/png" href="assets/logo-simbolo.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preload" href="assets/fuentes/nunito-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fuentes/fredoka-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/estilos.css?v=089e491dca">
<style>
.ar { max-width: 820px; margin: 0 auto; padding-block: 24px 56px; display: flex; flex-direction: column; gap: 20px; }
.ar form { display: flex; flex-direction: column; gap: 18px; }
.ar label { display: flex; flex-direction: column; gap: 8px; font-weight: 800; font-size: 16px; }
.ar textarea { min-height: 116px; }
.ar .ok { display: flex; gap: 14px; align-items: flex-start; background: var(--leaf-soft); border-radius: var(--r-md); padding: 16px 18px; font-weight: 600; }
.ar .ok .big { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--leaf); color: var(--on-leaf); display: grid; place-items: center; font-family: var(--display); font-size: 22px; font-weight: 700; }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js?v=089e491dca"></script>
<script src="assets/acceso.js?v=089e491dca" defer></script>
</head>
<body>
<div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<header class="topbar"><div class="wrap gut">
  <span class="thumb"><img src="assets/logo-simbolo.png" alt="Eight Academy"></span>
  <div class="t"><b>Autorreflexión</b><span>Experiencias de Aprendizaje · Eight Academy</span></div>
</div></header>
<main class="ar gut" id="m" aria-live="polite"></main>
<footer class="footer"><div class="wrap gut">Eight Academy · Unidad Educativa — We are the change. · <a href="privacidad.html">Aviso de privacidad</a></div></footer>
<div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var token = (new URLSearchParams(location.search).get('a') || '').slice(0, 80);
  var m = document.getElementById('m');
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  function fechaLarga(iso) { var x = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return x ? Number(x[3]) + ' de ' + MESES[Number(x[2]) - 1] + ' de ' + x[1] : String(iso || ''); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function cab(t, sub) { return '<div class="tb"><div class="t"><span class="sub">Autorreflexión · Eight Academy</span><h1>' + t + '</h1>' + (sub ? '<p class="meta">' + sub + '</p>' : '') + '</div></div>'; }
  function otraCuenta() { return '<div><button class="btn ghost" type="button" id="otra">Usar otra cuenta</button></div>'; }
  function enlazarOtra() { var b = document.getElementById('otra'); if (b) b.addEventListener('click', function () { REA_WEB.salir(); }); }
  if (!token) { m.innerHTML = cab('Este enlace no es válido') + '<p class="lead">Abre el enlace completo que llegó a tu correo.</p>'; return; }
  REA_WEB.iniciar({
    titulo: 'Autorreflexión de tu clase', eyebrow: 'Antes de tu conversación 1 a 1',
    texto: 'Entra con tu cuenta institucional para responder. El enlace es personal y solo se abre con tu cuenta.',
    pasos: ['Inicia sesión con tu cuenta institucional', 'Responde las cuatro preguntas sobre tu clase', 'Las conversamos en nuestro encuentro 1 a 1'],
    alEntrar: cargar
  });
  function cargar() {
    m.innerHTML = '<div class="loading"><span class="spin"></span>Abriendo tu autorreflexión…</div>';
    REA_WEB.llamar('autorreflexionInfo', { token: token }).then(pintar).catch(function (e) {
      m.innerHTML = cab('No se pudo abrir') + '<p class="err">' + esc(e.message) + '</p>' + (e.codigo === 'DOMINIO' ? otraCuenta() : '');
      enlazarOtra();
    });
  }
  function pintar(D) {
    var u = REA_WEB.usuario() || {};
    if (D.estado === 'noexiste') { m.innerHTML = cab('Este enlace no es válido') + '<p class="lead">Pide un enlace nuevo al Departamento de Experiencias de Aprendizaje.</p>'; return; }
    if (D.estado === 'denegado') {
      m.innerHTML = cab('Este enlace es personal') + '<p class="lead">Entraste como <b>' + esc(u.email) + '</b>. Ábrelo con la cuenta institucional del docente observado.</p>' + otraCuenta();
      enlazarOtra(); return;
    }
    var c = cab('Tu clase del ' + esc(fechaLarga(D.fecha)), esc([D.asignatura, D.curso].filter(Boolean).join(' · ')));
    if (D.estado === 'respondida') { m.innerHTML = c + '<div class="ok"><span class="big" aria-hidden="true">✓</span><div><b>Gracias, ' + esc(D.nombre) + '.</b> Recibimos tu autorreflexión. La conversaremos en nuestro encuentro 1 a 1.</div></div>'; return; }
    m.innerHTML = c + '<p class="lead">Hola, ' + esc(D.nombre) + '. Responde estas cuatro preguntas antes de nuestra conversación. No hay respuestas correctas: nos interesa tu lectura de la clase.</p>' +
      '<form id="f" class="card" novalidate>' + D.preguntas.map(function (q, i) {
        return '<label for="q' + i + '"><span class="row" style="gap:10px;flex-wrap:nowrap;align-items:flex-start"><span class="num n' + (i + 1) + '">' + (i + 1) + '</span><span>' + esc(q) + '</span></span><textarea id="q' + i + '" maxlength="2000" required></textarea></label>';
      }).join('') + '<div id="e"></div><div><button class="btn" type="submit" id="b">Enviar autorreflexión</button></div></form>';
    // Borrador local: si la sesión expira o se cierra la pestaña, lo escrito no se pierde.
    var clave = 'rea_auto_' + token;
    try { var g = JSON.parse(localStorage.getItem(clave) || '[]'); g.forEach(function (t, i) { var el = document.getElementById('q' + i); if (el && t) el.value = t; }); } catch (err) { }
    m.addEventListener('input', function () { try { localStorage.setItem(clave, JSON.stringify([0, 1, 2, 3].map(function (i) { return document.getElementById('q' + i).value; }))); } catch (err) { } });
    document.getElementById('f').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var r = [0, 1, 2, 3].map(function (i) { return document.getElementById('q' + i).value; });
      if (r.some(function (x) { return x.trim().length < 2; })) { document.getElementById('e').innerHTML = '<div class="err">Responde las cuatro preguntas.</div>'; return; }
      var b = document.getElementById('b'); b.disabled = true; b.textContent = 'Enviando…';
      REA_WEB.llamar('autorreflexionEnviar', { token: token, respuestas: r }).then(function () {
        try { localStorage.removeItem(clave); } catch (err) { }
        D.estado = 'respondida'; pintar(D); window.scrollTo(0, 0);
      }).catch(function (e) {
        b.disabled = false; b.textContent = 'Enviar autorreflexión';
        document.getElementById('e').innerHTML = '<div class="err">' + esc(e.message) + '</div>';
      });
    });
  }
});
</script>
</body>
</html>
